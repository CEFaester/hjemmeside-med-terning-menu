<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Terning Menu Layout</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="split-layout">
    <!-- Venstre side til fremtidigt indhold -->
    <section class="split-layout__content">
      
    </section>

    <!-- Højre side til terningen -->
    <section class="split-layout__menu">

      <!-- BEM Block: Scenen -->
      <div class="scene">
        <!-- BEM Block: Terningen -->
        <div class="cube">
          <!-- BEM Elements med Modifiers for hver side -->
          <div class="cube__face cube__face--front">Forside</div>
          <div class="cube__face cube__face--back">Bagside</div>
          <div class="cube__face cube__face--right">Højre</div>
          <div class="cube__face cube__face--left">Venstre</div>
          <div class="cube__face cube__face--top">Top</div>
          <div class="cube__face cube__face--bottom">Bund</div>
        </div>
      </div>
      
    </section>
  </main>

</body>
</html>
