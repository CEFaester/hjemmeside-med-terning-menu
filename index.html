<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Terning Menu Layout</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>

  <main class="split-layout">
    <section class="split-layout__content">
      
    </section>

    <section class="split-layout__menu">

      <div class="scene">
          <div class="cube" id="cube">
            
            <div class="cube__face cube__face--front">
              <nav class="cube__menu">
                <button class="cube__menu-item" onclick="goToPage('right', event)">Om mig</button>
                <button class="cube__menu-item" onclick="goToPage('back', event)">Projekter</button>
                <button class="cube__menu-item" onclick="goToPage('left', event)">Kontakt</button>
              </nav>
            </div>

            <div class="cube__face cube__face--right content-face" onclick="returnToMenu()">
              <h2>Om mig</h2>
            </div>
            
            <div class="cube__face cube__face--back content-face" onclick="returnToMenu()">
              <h2>Projekter</h2>
            </div>
            
            <div class="cube__face cube__face--left content-face" onclick="returnToMenu()">
              <h2>Kontakt</h2>
            </div>
            
            <div class="cube__face cube__face--top content-face" onclick="returnToMenu()">Top</div>
            <div class="cube__face cube__face--bottom content-face" onclick="returnToMenu()">Bund</div>
            
          </div>
        </div>

    </section>
      
  </main>

</body>
</html>
